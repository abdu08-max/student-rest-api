<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Student ID Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one ID card. A dark identity rail (photo, roll no, batch, year) beside a data sheet (name, bio, skills, links).
   Edit mode swaps the sheet for a form on the same grid. */
:root {
  --ground: #E3E7EE;
  --card: #FBFCFE;
  --ink: #121B33;
  --muted: #566077;
  --line: #D2D8E3;
  --accent: #2646E6;
  --accent-ink: #FFFFFF;
  --stamp: #F0A800;
  --stamp-ink: #2A1E00;
  --rail: #121B33;
  --rail-ink: #EDF0F8;
  --rail-muted: #9AA5C0;
  --field: #FFFFFF;
  --danger: #B3261E;
  --seg-off: #D9DFEA;
  --shadow: 0 1px 0 rgba(18,27,51,.06), 0 18px 40px -18px rgba(18,27,51,.35);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0B101D; --card: #141B2D; --ink: #E8ECF6; --muted: #97A1B8; --line: #26304A;
    --accent: #8197FF; --accent-ink: #0B101D; --stamp: #F2B632; --stamp-ink: #2A1E00;
    --rail: #1D2845; --rail-ink: #EDF0F8; --rail-muted: #98A4C4; --field: #0E1424;
    --danger: #FF8A80; --seg-off: #2A3552; --shadow: 0 18px 40px -18px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0B101D; --card: #141B2D; --ink: #E8ECF6; --muted: #97A1B8; --line: #26304A;
  --accent: #8197FF; --accent-ink: #0B101D; --stamp: #F2B632; --stamp-ink: #2A1E00;
  --rail: #1D2845; --rail-ink: #EDF0F8; --rail-muted: #98A4C4; --field: #0E1424;
  --danger: #FF8A80; --seg-off: #2A3552; --shadow: 0 18px 40px -18px rgba(0,0,0,.7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font: 15px/1.55 var(--f-body); }
.wrap { max-width: 980px; margin-inline: auto; padding-inline: 16px; padding-block: 32px 48px; }
.eyebrow { font: 500 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

.id { display: grid; grid-template-columns: 276px minmax(0, 1fr); background: var(--card); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }

/* rail */
.rail { background: var(--rail); color: var(--rail-ink); padding: 0 24px 28px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.slot { width: 64px; height: 14px; border-radius: 7px; background: var(--ground); margin: 14px auto 0; box-shadow: inset 0 2px 3px rgba(0,0,0,.35); }
.photo { aspect-ratio: 4 / 5; width: 100%; border-radius: 6px; overflow: hidden; background: #2B3758; position: relative; outline: 1px solid rgba(255,255,255,.18); outline-offset: 5px; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph { width: 100%; height: 100%; display: grid; place-items: center; font: 700 76px/1 var(--f-display); letter-spacing: -.02em; color: #DCE3F7;
  background: repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 2px, transparent 2px 14px), #2B3758; }
.facts { display: grid; grid-template-columns: 1fr; gap: 12px; margin: 0; }
.facts div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-top: 1px solid rgba(255,255,255,.14); padding-top: 10px; min-width: 0; }
.facts dt { font: 500 10.5px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--rail-muted); }
.facts dd { margin: 0; font: 500 14px/1.2 var(--f-mono); text-align: right; overflow-wrap: anywhere; }
.stamp { margin-top: auto; display: flex; align-items: center; gap: 14px; background: var(--stamp); color: var(--stamp-ink); border-radius: 6px; padding: 12px 16px; }
.stamp b { font: 800 44px/1 var(--f-display); }
.stamp span { font: 500 11px/1.3 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; }
.rail-tools { display: flex; flex-wrap: wrap; gap: 8px; }

/* sheet */
.sheet { padding: 32px 36px 36px; min-width: 0; display: flex; flex-direction: column; gap: 28px; }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.head > div { min-width: 0; }
h1 { font: 700 clamp(2rem, 5vw, 3.1rem)/1.02 var(--f-display); letter-spacing: -.02em; margin: 10px 0 8px; text-wrap: balance; overflow-wrap: anywhere; }
.campus { color: var(--muted); margin: 0; }
.bio { margin: 0; max-width: 62ch; font-size: 16px; }
.sec-h { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.sec-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px 24px; margin: 0; padding: 0; list-style: none; }
.skills li { min-width: 0; }
.sk-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 6px; }
.sk-name { font-weight: 600; overflow-wrap: anywhere; }
.sk-lvl { font: 400 11px/1 var(--f-mono); color: var(--muted); white-space: nowrap; }
.segs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.seg { height: 6px; border-radius: 1px; background: var(--seg-off); }
.seg.on { background: var(--accent); }
.links { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0 28px; }
.links li { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.lk-type { font: 500 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.lk-val { overflow-wrap: anywhere; min-width: 0; }
a.lk-val { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; text-decoration-thickness: 2px; }
a.lk-val:hover { text-decoration-color: var(--accent); color: var(--accent); }
.lk-go { font: 500 12px/1 var(--f-mono); color: var(--muted); }
.empty { color: var(--muted); margin: 0; }

/* buttons */
.btn { font: 600 14px/1 var(--f-body); border-radius: 6px; padding: 11px 16px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost-rail { border-color: rgba(255,255,255,.3); color: var(--rail-ink); padding: 9px 12px; font-size: 13px; }
.btn.ghost-rail:hover { border-color: var(--rail-ink); }
.btn.small { padding: 8px 11px; font-size: 13px; }
.btn.icon { padding: 8px 10px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rail :focus-visible { outline-color: var(--stamp); }

/* form */
.form { display: flex; flex-direction: column; gap: 22px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .lab { font: 500 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.in { width: 100%; padding: 10px 12px; border: 1px solid var(--line); background: var(--field); color: var(--ink); border-radius: 6px; font: inherit; min-width: 0; }
.in:hover { border-color: var(--muted); }
.in.name { font: 700 24px/1.2 var(--f-display); padding: 10px 12px; }
textarea.in { resize: vertical; min-height: 92px; }
.in[aria-invalid="true"] { border-color: var(--danger); }
.err { color: var(--danger); font-size: 13px; margin: 0; }
.count { font: 400 11px/1 var(--f-mono); color: var(--muted); align-self: flex-end; }
.rows { display: flex; flex-direction: column; gap: 10px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; }
.row.link { grid-template-columns: 124px minmax(0, 1fr) auto; }
.pick { display: flex; gap: 3px; }
.pick button { width: 22px; height: 28px; border: 0; padding: 0; background: transparent; cursor: pointer; position: relative; }
.pick button::after { content: ""; position: absolute; inset: 11px 1px; background: var(--seg-off); border-radius: 1px; }
.pick button.on::after { background: var(--accent); }
.pick button:hover::after { background: var(--muted); }
.pick button.on:hover::after { background: var(--accent); filter: brightness(1.15); }
.add { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 4px; }
.hint { font: 400 12px/1.5 var(--f-mono); color: var(--muted); margin: 14px 2px 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); background: var(--ink); color: var(--card); padding: 11px 16px; border-radius: 6px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 760px) {
  .id { grid-template-columns: minmax(0, 1fr); }
  .rail { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 16px 20px; padding: 0 20px 22px; align-items: start; }
  .slot { grid-column: 1 / -1; }
  .rail-main { display: contents; }
  .photo { grid-column: 1; grid-row: 2 / span 3; }
  .facts { grid-column: 2; grid-row: 2; }
  .stamp { grid-column: 2; grid-row: 3; margin-top: 0; }
  .rail-tools { grid-column: 1 / -1; }
  .ph { font-size: 44px; }
  .sheet { padding: 24px 20px 28px; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 420px) {
  .rail { grid-template-columns: 104px minmax(0, 1fr); }
  .row.link { grid-template-columns: minmax(0, 1fr) auto; }
  .row.link select { grid-column: 1 / -1; }
  .links li { grid-template-columns: 72px minmax(0, 1fr) auto; }
}
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>

<main class="wrap">
  <article class="id" id="card" aria-live="off"></article>
  <p class="hint" id="sample-note" hidden>Sample details are shown. Choose Edit profile to replace them with your own.</p>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var KEY = "student-profile-v1";
  var DEPTS = ["Artificial Intelligence and Data Science", "Computer Science and Engineering", "Information Technology", "Electronics and Communication Engineering", "Electrical and Electronics Engineering", "Mechanical Engineering", "Civil Engineering", "Biotechnology", "Business Administration"];
  var LEVELS = ["", "Beginner", "Familiar", "Proficient", "Advanced", "Expert"];
  var LINK_TYPES = ["GitHub", "LinkedIn", "Portfolio", "Email", "Kaggle", "X", "Instagram"];
  var YEARS = ["1st", "2nd", "3rd", "4th"];
  var SAMPLE = {
    name: "Abdul Muhaiman Basha",
    photo: null,
    dept: "Artificial Intelligence and Data Science",
    year: 2,
    roll: "2127250502002",
    campus: "Chennai",
    bio: "Second-year student who likes turning messy datasets into something a person can read at a glance. Currently building a bus-arrival predictor and learning how to deploy models without breaking them.",
    skills: [
      { name: "Python", level: 4 }, { name: "SQL", level: 3 }, { name: "Pandas", level: 4 },
      { name: "scikit-learn", level: 3 }, { name: "Data structures in C", level: 3 }, { name: "Git", level: 2 }
    ],
    links: [
      { type: "GitHub", value: "https://github.com/abdu08-max" },
      { type: "LinkedIn", value: "https://www.linkedin.com/in/abdul-muhaiman-basha-a82b54253/" },
      { type: "Email", value: "2025ad0952@svce.ac.in" }
    ]
  };

  var card = document.getElementById("card");
  var note = document.getElementById("sample-note");
  var toastEl = document.getElementById("toast");
  var hasSaved = false, editing = false, draft = null, errors = {}, toastTimer = 0;
  var profile = load();

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var p = JSON.parse(raw); if (p && typeof p.name === "string") { hasSaved = true; return p; } }
    } catch (e) {}
    return clone(SAMPLE);
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(profile)); return true; } catch (e) { return false; }
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
  }
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2600);
  }
  function batch(year) {
    var d = new Date();
    var fall = d.getMonth() >= 5 ? d.getFullYear() : d.getFullYear() - 1;
    var start = fall - (Number(year) - 1);
    return start + "–" + (start + 4);
  }
  function initials(name) {
    var parts = String(name).trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
  }
  function photoInner(p) {
    return p.photo ? '<img src="' + esc(p.photo) + '" alt="Photo of ' + esc(p.name) + '">' : '<div class="ph" aria-hidden="true">' + esc(initials(p.name)) + "</div>";
  }
  function normUrl(type, v) {
    v = String(v).trim();
    if (type === "Email") return v;
    return /^https?:\/\//i.test(v) ? v : "https://" + v;
  }
  function validLink(type, v) {
    if (type === "Email") return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    try { return new URL(normUrl(type, v)).hostname.indexOf(".") > 0; } catch (e) { return false; }
  }
  function showLink(type, v) {
    return type === "Email" ? v : v.replace(/^https?:\/\/(www\.)?/i, "").replace(/\/$/, "");
  }

  /* ---------- view ---------- */
  function railHTML(p, tools) {
    return '<aside class="rail"><div class="slot" aria-hidden="true"></div>' +
      '<div class="rail-main">' +
      '<div class="photo" id="photo-frame">' + photoInner(p) + "</div>" +
      '<dl class="facts"><div><dt>Roll no</dt><dd id="f-roll">' + esc(p.roll || "—") + "</dd></div>" +
      '<div><dt>Batch</dt><dd id="f-batch">' + batch(p.year) + "</dd></div></dl>" +
      '<div class="stamp"><b id="f-year">' + esc(p.year) + '</b><span>Year of<br>study</span></div></div>' +
      (tools || "") + "</aside>";
  }
  function viewHTML(p) {
    var skills = p.skills.length ? '<ul class="skills">' + p.skills.map(function (s) {
      var segs = ""; for (var i = 1; i <= 5; i++) segs += '<span class="seg' + (i <= s.level ? " on" : "") + '"></span>';
      return '<li><div class="sk-top"><span class="sk-name">' + esc(s.name) + '</span><span class="sk-lvl">' + LEVELS[s.level] + "</span></div>" +
        '<div class="segs" role="img" aria-label="' + esc(s.name) + ", " + LEVELS[s.level] + ", " + s.level + ' of 5">' + segs + "</div></li>";
    }).join("") + "</ul>" : '<p class="empty">No skills added yet.</p>';
    var links = p.links.length ? '<ul class="links">' + p.links.map(function (l, i) {
      var shown = esc(showLink(l.type, l.value));
      if (l.type === "Email") {
        return '<li><span class="lk-type">' + esc(l.type) + '</span><span class="lk-val">' + shown + '</span><button class="btn small icon" data-action="copy" data-i="' + i + '" aria-label="Copy email address">Copy</button></li>';
      }
      return '<li><span class="lk-type">' + esc(l.type) + '</span><a class="lk-val" href="' + esc(l.value) + '" target="_blank" rel="noopener noreferrer">' + shown + '</a><span class="lk-go" aria-hidden="true">↗</span></li>';
    }).join("") + "</ul>" : '<p class="empty">No links added yet.</p>';
    return railHTML(p) +
      '<section class="sheet"><div class="head"><div><span class="eyebrow">' + esc(p.dept) + "</span><h1>" + esc(p.name) + "</h1>" +
      '<p class="campus">' + esc(YEARS[p.year - 1]) + " year" + (p.campus ? " · " + esc(p.campus) : "") + "</p></div>" +
      '<button class="btn primary" id="edit-btn" data-action="edit">Edit profile</button></div>' +
      (p.bio ? '<p class="bio">' + esc(p.bio) + "</p>" : "") +
      '<div><div class="sec-h"><span class="eyebrow">Skills · ' + p.skills.length + "</span></div>" + skills + "</div>" +
      '<div><div class="sec-h"><span class="eyebrow">Links · ' + p.links.length + "</span></div>" + links + "</div></section>";
  }

  /* ---------- edit ---------- */
  function errHTML(key) { return errors[key] ? '<p class="err" id="err-' + key + '">' + esc(errors[key]) + "</p>" : ""; }
  function editHTML(d) {
    var tools = '<div class="rail-tools"><button type="button" class="btn ghost-rail" data-action="pick-photo">' + (d.photo ? "Change photo" : "Upload photo") + "</button>" +
      (d.photo ? '<button type="button" class="btn ghost-rail" data-action="rm-photo">Remove</button>' : "") +
      '<input type="file" id="photo-input" accept="image/*" class="sr" tabindex="-1" aria-label="Photo file"></div>';
    var yearOpts = YEARS.map(function (y, i) { return '<option value="' + (i + 1) + '"' + (d.year === i + 1 ? " selected" : "") + ">" + y + " year</option>"; }).join("");
    var skillRows = d.skills.map(function (s, i) {
      var pick = ""; for (var l = 1; l <= 5; l++) pick += '<button type="button" class="' + (l <= s.level ? "on" : "") + '" data-action="level" data-i="' + i + '" data-l="' + l + '" aria-label="' + esc(s.name || "Skill") + ": " + LEVELS[l] + '" aria-pressed="' + (l === s.level) + '"></button>';
      return '<div class="row"><input class="in" id="sk-' + i + '" data-skill="' + i + '" value="' + esc(s.name) + '" maxlength="32" aria-label="Skill name"><div class="pick" role="group" aria-label="Level">' + pick +
        '</div><button type="button" class="btn small icon" data-action="rm-skill" data-i="' + i + '" aria-label="Remove ' + esc(s.name || "skill") + '">Remove</button></div>';
    }).join("");
    var linkRows = d.links.map(function (l, i) {
      var opts = LINK_TYPES.map(function (t) { return "<option" + (t === l.type ? " selected" : "") + ">" + t + "</option>"; }).join("");
      var bad = errors["link" + i];
      return '<div><div class="row link"><select class="in" data-linktype="' + i + '" aria-label="Link type">' + opts + '</select><input class="in" id="lk-' + i + '" data-linkval="' + i + '" value="' +
        esc(l.value) + '" placeholder="' + (l.type === "Email" ? "name@college.edu" : "github.com/username") + '" aria-label="Link address"' + (bad ? ' aria-invalid="true"' : "") +
        '><button type="button" class="btn small icon" data-action="rm-link" data-i="' + i + '" aria-label="Remove ' + esc(l.type) + ' link">Remove</button></div>' + (bad ? '<p class="err">' + esc(bad) + "</p>" : "") + "</div>";
    }).join("");
    return railHTML(d, tools) + '<section class="sheet"><form class="form" id="profile-form" novalidate>' +
      '<div class="head"><div><span class="eyebrow">Editing profile</span></div></div>' +
      '<div class="field"><label for="in-name">Full name</label><input class="in name" id="in-name" data-field="name" value="' + esc(d.name) + '" maxlength="60" autocomplete="name"' + (errors.name ? ' aria-invalid="true" aria-describedby="err-name"' : "") + ">" + errHTML("name") + "</div>" +
      '<div class="grid2"><div class="field"><label for="in-dept">Department</label><input class="in" id="in-dept" data-field="dept" list="dept-list" value="' + esc(d.dept) + '" maxlength="70"><datalist id="dept-list">' + DEPTS.map(function (x) { return '<option value="' + esc(x) + '">'; }).join("") + "</datalist></div>" +
      '<div class="field"><label for="in-year">Year</label><select class="in" id="in-year" data-field="year">' + yearOpts + "</select></div>" +
      '<div class="field"><label for="in-roll">Roll number</label><input class="in" id="in-roll" data-field="roll" value="' + esc(d.roll) + '" maxlength="20"></div>' +
      '<div class="field"><label for="in-campus">City or campus</label><input class="in" id="in-campus" data-field="campus" value="' + esc(d.campus) + '" maxlength="40"></div></div>' +
      '<div class="field"><label for="in-bio">About</label><textarea class="in" id="in-bio" data-field="bio" maxlength="220">' + esc(d.bio) + '</textarea><span class="count" id="bio-count">' + d.bio.length + " / 220</span></div>" +
      '<div class="field"><span class="lab">Skills</span><div class="rows">' + skillRows + '</div><div class="add" style="margin-top:4px"><input class="in" id="new-skill" placeholder="Add a skill, then press Enter" maxlength="32" aria-label="New skill name"><button type="button" class="btn small" data-action="add-skill">Add skill</button></div>' + errHTML("skills") + "</div>" +
      '<div class="field"><span class="lab">Links</span><div class="rows">' + linkRows + "</div>" +
      (d.links.length < 6 ? '<div><button type="button" class="btn small" data-action="add-link" style="margin-top:4px">Add link</button></div>' : "") + "</div>" +
      '<div class="actions"><button type="submit" class="btn primary">Save changes</button><button type="button" class="btn" data-action="cancel">Cancel</button></div></form></section>';
  }

  function render(focusSel) {
    card.innerHTML = editing ? editHTML(draft) : viewHTML(profile);
    note.hidden = hasSaved || editing;
    if (focusSel) { var el = card.querySelector(focusSel); if (el) el.focus(); }
  }

  /* ---------- actions ---------- */
  function startEdit() { draft = clone(profile); errors = {}; editing = true; render("#in-name"); }
  function cancel() { editing = false; draft = null; errors = {}; render("#edit-btn"); }
  function addSkill() {
    var inp = document.getElementById("new-skill"); var v = inp.value.trim();
    if (!v) { inp.focus(); return; }
    if (draft.skills.length >= 12) { toast("Twelve skills is the limit."); return; }
    if (draft.skills.some(function (s) { return s.name.toLowerCase() === v.toLowerCase(); })) { toast(v + " is already listed."); return; }
    draft.skills.push({ name: v, level: 3 }); delete errors.skills; render("#new-skill");
  }
  function save() {
    var clean = clone(draft); errors = {};
    clean.name = clean.name.trim(); clean.dept = clean.dept.trim(); clean.roll = clean.roll.trim(); clean.campus = clean.campus.trim(); clean.bio = clean.bio.trim();
    if (!clean.name) errors.name = "Enter your name so the card has a title.";
    clean.skills = clean.skills.filter(function (s) { return s.name.trim(); }).map(function (s) { return { name: s.name.trim(), level: s.level }; });
    var keep = [], bad = false;
    draft.links.forEach(function (l, i) {
      if (!l.value.trim()) return;
      if (!validLink(l.type, l.value.trim())) { errors["link" + i] = l.type === "Email" ? "Use an address like name@college.edu." : "Enter a web address such as github.com/username."; bad = true; return; }
      keep.push({ type: l.type, value: normUrl(l.type, l.value.trim()) });
    });
    if (errors.name || bad) {
      render(errors.name ? "#in-name" : "[aria-invalid='true']"); toast("Fix the highlighted fields to save."); return;
    }
    clean.links = keep; profile = clean; hasSaved = true; editing = false; draft = null;
    var ok = persist(); render("#edit-btn");
    toast(ok ? "Profile saved." : "Saved for this view only. Browser storage is unavailable.");
  }
  function handlePhoto(file) {
    if (!file) return;
    if (!/^image\//.test(file.type)) { toast("Choose an image file."); return; }
    if (file.size > 10 * 1024 * 1024) { toast("That image is over 10 MB."); return; }
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var W = 480, H = 600, c = document.createElement("canvas"); c.width = W; c.height = H;
        var ctx = c.getContext("2d"), r = Math.max(W / img.width, H / img.height), w = img.width * r, h = img.height * r;
        ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
        draft.photo = c.toDataURL("image/jpeg", 0.86); render(".rail-tools button");
      };
      img.onerror = function () { toast("That image could not be read."); };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

  card.addEventListener("click", function (e) {
    var b = e.target.closest("[data-action]"); if (!b) return;
    var a = b.getAttribute("data-action"), i = Number(b.getAttribute("data-i"));
    if (a === "edit") startEdit();
    else if (a === "cancel") cancel();
    else if (a === "pick-photo") document.getElementById("photo-input").click();
    else if (a === "rm-photo") { draft.photo = null; render(".rail-tools button"); }
    else if (a === "level") { draft.skills[i].level = Number(b.getAttribute("data-l")); render('[data-action="level"][data-i="' + i + '"][data-l="' + draft.skills[i].level + '"]'); }
    else if (a === "rm-skill") { draft.skills.splice(i, 1); render("#new-skill"); }
    else if (a === "add-skill") addSkill();
    else if (a === "add-link") { draft.links.push({ type: "GitHub", value: "" }); render("#lk-" + (draft.links.length - 1)); }
    else if (a === "rm-link") { draft.links.splice(i, 1); errors = {}; render('[data-action="add-link"]'); }
    else if (a === "copy") {
      var v = profile.links[i].value;
      var p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(v) : Promise.reject();
      p.then(function () { toast("Email address copied."); }, function () { toast("Copy was blocked. Select the address to copy it."); });
    }
  });
  card.addEventListener("input", function (e) {
    var t = e.target, f = t.getAttribute("data-field");
    if (f && f !== "year") {
      draft[f] = t.value;
      if (f === "bio") document.getElementById("bio-count").textContent = t.value.length + " / 220";
      if (f === "name") { var fr = document.getElementById("photo-frame"); if (!draft.photo) fr.innerHTML = photoInner(draft); }
      if (f === "roll") document.getElementById("f-roll").textContent = t.value || "—";
      if (f === "name" && errors.name && t.value.trim()) { delete errors.name; t.removeAttribute("aria-invalid"); var er = document.getElementById("err-name"); if (er) er.remove(); }
    }
    if (t.hasAttribute("data-skill")) draft.skills[Number(t.getAttribute("data-skill"))].name = t.value;
    if (t.hasAttribute("data-linkval")) { var li = Number(t.getAttribute("data-linkval")); draft.links[li].value = t.value; if (errors["link" + li]) { delete errors["link" + li]; t.removeAttribute("aria-invalid"); var n = t.parentNode.nextElementSibling; if (n && n.className === "err") n.remove(); } }
  });
  card.addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "photo-input") { handlePhoto(t.files && t.files[0]); return; }
    if (t.getAttribute("data-field") === "year") {
      draft.year = Number(t.value);
      document.getElementById("f-year").textContent = draft.year; document.getElementById("f-batch").textContent = batch(draft.year);
    }
    if (t.hasAttribute("data-linktype")) { var i = Number(t.getAttribute("data-linktype")); draft.links[i].type = t.value; var inp = document.getElementById("lk-" + i); inp.placeholder = t.value === "Email" ? "name@college.edu" : "github.com/username"; }
  });
  card.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.id === "new-skill") { e.preventDefault(); addSkill(); }
    else if (e.key === "Escape" && editing) { cancel(); }
  });
  card.addEventListener("submit", function (e) { e.preventDefault(); save(); });

  render();
})();
</script>

</body></html>
